<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">♨</div><div><span>Diário de</span><strong>Receitas<br>do <em>Fábio</em></strong></div></div>
      <nav class="main-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-view="inicio">⌂ <span>Início</span></button>
        <button class="nav-item" data-view="receitas">▣ <span>Minhas receitas</span></button>
        <button class="nav-item" data-view="favoritas">♥ <span>Favoritas</span></button>
        <button class="nav-item" data-view="categorias">▦ <span>Categorias</span></button>
        <button class="nav-item" data-view="compras">🛒 <span>Lista de compras</span></button>
        <button class="nav-item" data-view="testar">▱ <span>Quero testar</span></button>

      </nav>

    </aside>
    <main class="content">
      <header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div class="search"><span>⌕</span><input id="searchInput" placeholder="Busque uma receita, ingrediente ou tag..." /></div><div class="top-actions"><button id="notifications" title="Notificações" aria-label="Abrir notificações">♧</button><button class="profile-shortcut" id="profileShortcut" aria-label="Abrir meu perfil"><div class="avatar"><img src="assets/perfil-fabio.jpg" alt="Fábio"></div><b>Fábio</b><span>⌄</span></button></div></header>
      <div id="app"></div>

  </div>
  <div class="modal-backdrop" id="modal"><section class="modal"><button class="close" id="closeModal">×</button><div class="eyebrow">NOVA MEMÓRIA À MESA</div><h2>Adicionar receita</h2><p class="muted">Registre um sabor para lembrar depois.</p><form id="recipeForm"><label>Nome da receita<input name="name" required placeholder="Ex.: Bolo de fubá da vó" /></label><div class="form-grid"><label>Categoria<select name="category"><option>Almoços</option><option>Jantares</option><option>Sobremesas</option><option>Café da manhã</option><option>Bebidas</option><option>Saudáveis</option></select></label><label>Tempo de preparo<input name="time" placeholder="45 min" /></label></div><div class="form-grid"><label>Rendimento<input name="serves" placeholder="Ex.: 6 porções" /></label><label>Etiquetas<input name="tags" placeholder="família, rápido" /></label></div><label>Imagem da receita (URL)<input name="image" placeholder="https://..." /></label><label>Ingredientes<textarea name="ingredients" rows="4" placeholder="Um ingrediente por linha"></textarea></label><label>Modo de preparo<textarea name="prep" rows="4" placeholder="Descreva o passo a passo"></textarea></label><label>Memória ou observação<textarea name="memory" rows="3" placeholder="O que torna essa receita especial?"></textarea></label><button class="primary full" type="submit">Guardar no diário</button></form></section></div>
  <script src="app.js?v=20260914-7"></script>
